name: Aachen pilot validation

on:
  push:
    branches:
      - pilot-aachen-mvp
      - verified-ocg-feature-base
      - 'sync/ocg-upstream-*'
    paths-ignore:
      - pilot/aachen/DEPLOYMENT-GATES.md
  pull_request:
    branches:
      - main
    paths-ignore:
      - pilot/aachen/DEPLOYMENT-GATES.md

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate private pilot shell syntax
        run: |
          bash -n pilot/aachen/private-smoke-test.sh
          bash -n pilot/aachen/pin-runtime-images.sh
          bash -n pilot/aachen/private-product-e2e-prepare.sh
          bash -n pilot/aachen/private-product-e2e-run.sh
          bash -n pilot/aachen/private-product-e2e-cluster-run.sh
          bash -n pilot/aachen/private-product-e2e-sidecar-run.sh

      - name: Verify reviewed stats responsive core exception
        shell: bash
        run: |
          set -Eeuo pipefail
          stats_template=ocg-server/templates/site/stats/page.html
          test "$(grep -Fc 'wrapper_class = "min-w-0"' "$stats_template")" -eq 8
          test "$(grep -Fc 'grid grid-cols-1 xl:grid-cols-2 gap-6' "$stats_template")" -eq 4
          grep -Fq 'name: "statistics",' tests/e2e/site/common/responsive.spec.js
          test "$(grep -Fc 'test(`${responsivePage.name} fits every supported breakpoint`' tests/e2e/site/common/responsive.spec.js)" -eq 2
          grep -Fq 'expect(layoutBounds.scrollWidth).toBeLessThanOrEqual(layoutBounds.clientWidth + 2)' tests/e2e/site/common/responsive.spec.js

          payment_pattern='paid events (disable checkout until registration opens|disable checkout after registration closes|allow checkout controls while registration is open)'
          grep -Fq "payment_provider_test_pattern='$payment_pattern'" pilot/aachen/private-product-e2e-sidecar-run.sh
          test "$(grep -Ec '^  test\("paid events (disable checkout until registration opens|disable checkout after registration closes|allow checkout controls while registration is open)"' tests/e2e/site/event/registration-window.spec.js)" -eq 3

      - name: Verify pilot database runtime base is immutable PostgreSQL 17
        shell: bash
        run: |
          set -Eeuo pipefail
          postgres_digest='sha256:6b638839aa8ffdc0f1e186be8a04d544368b05110a314c40d3225a15e9c9c98d'
          grep -Fq "FROM docker.io/library/postgres@$postgres_digest" pilot/aachen/postgres-postgis/Dockerfile
          grep -Fq 'postgresql-17-postgis-3' pilot/aachen/postgres-postgis/Dockerfile
          grep -Fq 'postgresqlDataDir: /var/lib/postgresql/data' pilot/aachen/values-pilot.yaml
          grep -Fq 'mountPath: /var/lib/postgresql' pilot/aachen/values-pilot.yaml
          grep -Fq 'runAsUser: 999' pilot/aachen/values-pilot.yaml

      - name: Set up Helm 3 used by the pilot runtime
        uses: azure/setup-helm@v4
        with:
          version: v3.21.0

      - name: Build chart dependencies
        run: helm dependency build charts/ocg

      - name: Lint pilot chart
        run: >-
          helm lint charts/ocg
          -f pilot/aachen/values-pilot.yaml
          --set-string db.password=ci-database-password
          --set-string postgresql.auth.password=ci-database-password
          --set-string server.badges.signingKey=ci-placeholder

      - name: Prepare Aachen post-renderer
        run: |
          cp pilot/aachen/pin-runtime-images.sh /tmp/aachen-post-renderer
          chmod 700 /tmp/aachen-post-renderer

      - name: Render pilot manifests
        run: >-
          helm template zusammen-pilot charts/ocg
          -f pilot/aachen/values-pilot.yaml
          --set-string db.password=ci-database-password
          --set-string postgresql.auth.password=ci-database-password
          --set-string server.badges.signingKey=ci-placeholder
          --post-renderer /tmp/aachen-post-renderer
          > /tmp/zusammen-pilot.yaml

      - name: Render install migration bootstrap secret
        run: >-
          helm template zusammen-pilot charts/ocg
          -f pilot/aachen/values-pilot.yaml
          --set-string db.password=ci-database-password
          --set-string postgresql.auth.password=ci-database-password
          --set-string server.badges.signingKey=ci-placeholder
          --show-only templates/db_migrator_secret.yaml
          > /tmp/aachen-bootstrap-secret.yaml

      - name: Enforce payments disabled boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          rendered=/tmp/zusammen-pilot.yaml

          required_payment_paths=(
            ocg-server/src/db/payments.rs
            ocg-server/src/handlers/payments.rs
            ocg-server/src/handlers/payments/tests.rs
            ocg-server/src/handlers/dashboard/group/refunds.rs
            ocg-server/src/services/payments.rs
            ocg-server/src/services/payments/manager.rs
            ocg-server/src/services/payments/provider.rs
            ocg-server/src/services/payments/provider/stripe.rs
            ocg-server/src/services/payments/refund_recorder.rs
            ocg-server/src/services/payments/workers.rs
            ocg-server/src/services/payments/workers/application_fee_adjustment.rs
            ocg-server/src/services/payments/workers/claim_loop.rs
            ocg-server/src/services/payments/workers/credit_note.rs
            ocg-server/src/services/payments/workers/recovery.rs
            ocg-server/src/services/payments/workers/refund.rs
            ocg-server/src/services/payments/webhook_reconciler.rs
            ocg-server/src/types/payments.rs
          )
          for path in "${required_payment_paths[@]}"; do
            if [[ ! -s "$path" ]]; then
              echo "Required upstream payment capability is missing: $path" >&2
              exit 1
            fi
          done

          for values_file in charts/ocg/values.yaml pilot/aachen/values-pilot.yaml; do
            if ! grep -A 4 '^payments:$' "$values_file" | grep -Eq '^  enabled:[[:space:]]*false[[:space:]]*$'; then
              echo "Payments must default to disabled in $values_file" >&2
              exit 1
            fi
          done

          if grep -Eq '^[[:space:]]+(publishableKey|secretKey|webhookSecret|connectedWebhookSecret):[[:space:]]*[^[:space:]#]+' pilot/aachen/values-pilot.yaml; then
            echo 'Aachen pilot values must not contain committed payment provider credentials.' >&2
            exit 1
          fi

          if ! grep -Fq 'payments: null' "$rendered"; then
            echo 'The private pilot render must explicitly disable payments.' >&2
            exit 1
          fi
          if grep -Eq '^[[:space:]]+(publishable_key|secret_key|webhook_secret|connected_webhook_secret):' "$rendered"; then
            echo 'The private pilot render must not contain payment provider credentials.' >&2
            exit 1
          fi

          grep -Fq 'None => None' ocg-server/src/services/payments/provider.rs
          grep -Fq 'PaymentsNotConfigured' ocg-server/src/services/payments/manager.rs
          grep -Fq 'HandleWebhookError::PaymentsNotConfigured' ocg-server/src/handlers/payments.rs
          grep -Fq 'StatusCode::NOT_FOUND' ocg-server/src/handlers/payments.rs

          python3 - <<'PY'
          from pathlib import Path

          source = Path("ocg-server/src/handlers/event.rs").read_text()
          start = source.index("pub(crate) async fn enrollment_state(")
          end = source.index("/// Handler for leaving an event.", start)
          block = source[start:end]

          required = (
              "State(payments_cfg): State<Option<PaymentsConfig>>",
              "let payments_enabled = payments_cfg.is_some();",
              "let can_request_refund = if payments_enabled",
              "if payments_enabled {",
              "(None, None, None, None)",
              '"purchase_amount_minor": purchase_amount_minor',
              '"refund_rejection_reason": refund_rejection_reason',
              '"refund_request_status": refund_request_status',
              '"resume_checkout_url": resume_checkout_url',
          )
          missing = [needle for needle in required if needle not in block]
          if missing:
              raise SystemExit(
                  "Enrollment payment-off masking invariant missing: " + ", ".join(missing)
              )

          forbidden = (
              '"purchase_amount_minor": enrollment.purchase_amount_minor',
              '"refund_rejection_reason": enrollment.refund_rejection_reason',
              '"refund_request_status": enrollment.refund_request_status',
              '"resume_checkout_url": enrollment.resume_checkout_url',
          )
          leaked = [needle for needle in forbidden if needle in block]
          if leaked:
              raise SystemExit(
                  "Enrollment response bypasses payment-off masking: " + ", ".join(leaked)
              )

          status_renderer = Path(
              "ocg-server/static/js/event/attendance/status-renderer.js"
          ).read_text()
          pending_start = status_renderer.index('if (response.status === "pending-payment")')
          pending_end = status_renderer.index("if (response.admission_offer_id)", pending_start)
          pending_block = status_renderer[pending_start:pending_end]

          pending_required = (
              "if (!response.resume_checkout_url)",
              "attendButton.disabled = true",
              "delete attendButton.dataset.resumeUrl",
              "setAttendanceControlLabel(attendButton, PAID_TICKETS_UNAVAILABLE_LABEL)",
              "setAttendanceControlDisabledStyles(attendButton, true)",
          )
          pending_missing = [needle for needle in pending_required if needle not in pending_block]
          if pending_missing:
              raise SystemExit(
                  "Pending-payment payment-off CTA invariant missing: "
                  + ", ".join(pending_missing)
              )
          PY

      - name: Set up Rust for provider-independent payment tests
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Install Tailwind CSS for payment test build
        run: |
          wget -O /usr/local/bin/tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/download/v4.1.10/tailwindcss-linux-x64
          chmod +x /usr/local/bin/tailwindcss

      - name: Run provider-independent payment boundary tests
        run: |
          cargo test -p ocg-server get_or_create_checkout_redirect_url
          cargo test -p ocg-server request_refund
          cargo test -p ocg-server enrollment_state
          cargo test -p ocg-server start_checkout_completes_free_ticket_without_payments_config

      - name: Enforce private pilot manifest invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          rendered=/tmp/zusammen-pilot.yaml
          bootstrap=/tmp/aachen-bootstrap-secret.yaml
          postgres_runtime='zusammen-pilot-postgres:local'
          kubectl_digest='sha256:cd354d5b25562b195b277125439c23e4046902d7f1abc0dc3c75aad04d298c17'

          dump_image_lines() {
            grep -E '^[[:space:]]*(image:|imagePullPolicy:)' "$rendered" >&2 || true
          }
          require_rendered() {
            local needle="$1"
            local description="$2"
            if ! grep -Fq "$needle" "$rendered"; then
              echo "Missing required rendered invariant: $description" >&2
              dump_image_lines
              exit 1
            fi
          }
          require_bootstrap() {
            local needle="$1"
            local description="$2"
            if ! grep -Fq "$needle" "$bootstrap"; then
              echo "Missing required bootstrap invariant: $description" >&2
              exit 1
            fi
          }

          require_rendered "$postgres_runtime" 'local PostgreSQL 17 + PostGIS image'
          require_rendered 'imagePullPolicy: Never' 'fail-closed PostgreSQL image pull policy'
          require_rendered "$kubectl_digest" 'pinned kubectl helper digest'
          require_rendered 'image: zusammen-pilot-server:local' 'local OCG server image'
          require_rendered 'image: zusammen-pilot-dbmigrator:local' 'local database migrator image'
          require_rendered 'name: POSTGRES_DB' 'official PostgreSQL database-name environment variable'
          require_rendered 'value: ocg' 'OCG database identity'
          require_rendered 'runAsUser: 999' 'non-root PostgreSQL runtime user'
          require_rendered 'runAsNonRoot: true' 'non-root PostgreSQL runtime policy'
          require_bootstrap 'name: dbmigrator-config' 'database migrator bootstrap Secret'
          require_bootstrap '"helm.sh/hook": pre-upgrade' 'expected inherited pre-upgrade hook annotation'

          if grep -Fq 'docker.io/artifacthub/postgres' "$rendered"; then
            echo 'A private pilot render must not reference the chart sentinel PostgreSQL image.' >&2
            dump_image_lines
            exit 1
          fi
          if grep -Eq 'docker.io/(library/)?postgres(:|@)' "$rendered"; then
            echo 'A private pilot render must not reference an external Docker PostgreSQL image.' >&2
            dump_image_lines
            exit 1
          fi

          if grep -Eq 'docker.io/bitnamilegacy/kubectl:[^[:space:]\"]+' "$rendered"; then
            echo 'A private pilot render must not contain a mutable kubectl helper image.' >&2
            dump_image_lines
            exit 1
          fi

          if grep -q '^kind: Ingress$' "$rendered"; then
            echo 'A private pilot render must not contain an Ingress.' >&2
            exit 1
          fi

          if grep -Eq '^[[:space:]]*type:[[:space:]]*(NodePort|LoadBalancer)[[:space:]]*$' "$rendered"; then
            echo 'A private pilot render must not expose NodePort or LoadBalancer services.' >&2
            dump_image_lines
            exit 1
          fi

          if grep -Eq '^[[:space:]]*externalIPs:[[:space:]]*' "$rendered"; then
            echo 'A private pilot render must not configure external service IPs.' >&2
            exit 1
          fi

          if grep -Eq '^[[:space:]]*hostNetwork:[[:space:]]*true[[:space:]]*$|^[[:space:]]*hostPort:[[:space:]]*[0-9]+' "$rendered"; then
            echo 'A private pilot render must not expose pods through host networking or hostPort.' >&2
            exit 1
          fi

          if grep -Eq '^[[:space:]]*password:[[:space:]]*ocg[[:space:]]*$|^[[:space:]]*password[[:space:]]*=[[:space:]]*ocg[[:space:]]*$' "$rendered"; then
            echo 'The upstream default database password must not survive a deployment render.' >&2
            exit 1
          fi

  images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build database migrator image
        run: docker build -f database/migrations/Dockerfile -t zusammen-pilot-dbmigrator:ci .

      - name: Build application image
        run: >-
          docker build
          --build-arg OCG_COMMIT_SHA=${GITHUB_SHA}
          -f ocg-server/Dockerfile
          -t zusammen-pilot-server:ci
          .
