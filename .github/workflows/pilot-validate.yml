name: Aachen pilot validation

on:
  push:
    branches:
      - pilot-aachen-mvp
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate private pilot shell syntax
        run: |
          bash -n pilot/aachen/private-smoke-test.sh
          bash -n pilot/aachen/pin-runtime-images.sh

      - name: Verify pilot database base is immutable
        shell: bash
        run: |
          set -Eeuo pipefail
          postgres_digest='sha256:411febeab51f103cd36aa8655bebb3c4035974e0d6f6929a56fe863ad8c581b6'
          grep -Fq "FROM docker.io/artifacthub/postgres@$postgres_digest" pilot/aachen/postgres-postgis/Dockerfile

      - name: Set up Helm 3 used by the pilot runtime
        uses: azure/setup-helm@v4
        with:
          version: v3.21.0

      - name: Build chart dependencies
        run: helm dependency build charts/ocg

      - name: Lint pilot chart
        run: >-
          helm lint charts/ocg
          -f pilot/aachen/values-pilot.yaml
          --set-string db.password=ci-database-password
          --set-string postgresql.auth.password=ci-database-password
          --set-string server.badges.signingKey=ci-placeholder

      - name: Prepare Aachen post-renderer
        run: |
          cp pilot/aachen/pin-runtime-images.sh /tmp/aachen-post-renderer
          chmod 700 /tmp/aachen-post-renderer

      - name: Render pilot manifests
        run: >-
          helm template zusammen-pilot charts/ocg
          -f pilot/aachen/values-pilot.yaml
          --set-string db.password=ci-database-password
          --set-string postgresql.auth.password=ci-database-password
          --set-string server.badges.signingKey=ci-placeholder
          --post-renderer /tmp/aachen-post-renderer
          > /tmp/zusammen-pilot.yaml

      - name: Render install migration bootstrap secret
        run: >-
          helm template zusammen-pilot charts/ocg
          -f pilot/aachen/values-pilot.yaml
          --set-string db.password=ci-database-password
          --set-string postgresql.auth.password=ci-database-password
          --set-string server.badges.signingKey=ci-placeholder
          --show-only templates/db_migrator_secret.yaml
          > /tmp/aachen-bootstrap-secret.yaml

      - name: Enforce private pilot manifest invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          rendered=/tmp/zusammen-pilot.yaml
          bootstrap=/tmp/aachen-bootstrap-secret.yaml
          postgres_runtime='zusammen-pilot-postgres:local'
          kubectl_digest='sha256:cd354d5b25562b195b277125439c23e4046902d7f1abc0dc3c75aad04d298c17'

          grep -Fq "$postgres_runtime" "$rendered"
          grep -Fq 'imagePullPolicy: Never' "$rendered"
          grep -Fq "$kubectl_digest" "$rendered"
          grep -Fq 'image: zusammen-pilot-server:local' "$rendered"
          grep -Fq 'image: zusammen-pilot-dbmigrator:local' "$rendered"
          grep -Fq 'name: dbmigrator-config' "$bootstrap"
          grep -Fq '"helm.sh/hook": pre-upgrade' "$bootstrap"

          if grep -Fq 'docker.io/artifacthub/postgres' "$rendered"; then
            echo 'A private pilot render must not reference an external Artifact Hub PostgreSQL image.' >&2
            exit 1
          fi

          if grep -Eq 'docker.io/bitnamilegacy/kubectl:[^[:space:]\"]+' "$rendered"; then
            echo 'A private pilot render must not contain a mutable kubectl helper image.' >&2
            exit 1
          fi

          if grep -q '^kind: Ingress$' "$rendered"; then
            echo 'A private pilot render must not contain an Ingress.' >&2
            exit 1
          fi

          if grep -Eq '^[[:space:]]*type:[[:space:]]*(NodePort|LoadBalancer)[[:space:]]*$' "$rendered"; then
            echo 'A private pilot render must not expose NodePort or LoadBalancer services.' >&2
            exit 1
          fi

          if grep -Eq '^[[:space:]]*externalIPs:[[:space:]]*' "$rendered"; then
            echo 'A private pilot render must not configure external service IPs.' >&2
            exit 1
          fi

          if grep -Eq '^[[:space:]]*hostNetwork:[[:space:]]*true[[:space:]]*$|^[[:space:]]*hostPort:[[:space:]]*[0-9]+' "$rendered"; then
            echo 'A private pilot render must not expose pods through host networking or hostPort.' >&2
            exit 1
          fi

          if grep -Eq '^[[:space:]]*password:[[:space:]]*ocg[[:space:]]*$|^[[:space:]]*password[[:space:]]*=[[:space:]]*ocg[[:space:]]*$' "$rendered"; then
            echo 'The upstream default database password must not survive a deployment render.' >&2
            exit 1
          fi

  images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build database migrator image
        run: docker build -f database/migrations/Dockerfile -t zusammen-pilot-dbmigrator:ci .

      - name: Build application image
        run: >-
          docker build
          --build-arg OCG_COMMIT_SHA=${GITHUB_SHA}
          -f ocg-server/Dockerfile
          -t zusammen-pilot-server:ci
          .
