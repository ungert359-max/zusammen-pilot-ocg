name: Aachen smoke timeout diagnostics

on:
  push:
    branches:
      - pilot-aachen-mvp
    paths:
      - .github/workflows/aachen-smoke-postmortem.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HETZNER_HOST: 178.104.6.218
      HETZNER_USER: deploy
    steps:
      - name: Prepare pinned SSH connection
        shell: bash
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$HETZNER_SSH_KEY" || { echo 'HETZNER_SSH_KEY secret is unavailable.' >&2; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          178.104.6.218 ssh-rsa 
          178.104.6.218 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBL5b78TTMb3CUYtD9jeG5HzGFdFF+EAYFpn+52F1dbJ/W1rSPyb7u1CD7e3arzj0RogUH8m7w+q0RlqE/231uKI=
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

      - name: Read non-secret smoke namespace evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 \
            -i "$HOME/.ssh/id_ed25519" \
            "$HETZNER_USER@$HETZNER_HOST" \
            "sudo -n env KUBECONFIG=/etc/rancher/k3s/k3s.yaml bash -s" <<'REMOTE'
          set -Eeuo pipefail
          namespace=ocg-aachen-smoke
          echo '=== HELM RELEASES ==='
          helm list --namespace "$namespace" || true
          echo '=== WORKLOAD/PVC SNAPSHOT ==='
          kubectl -n "$namespace" get pods,jobs,pvc -o wide 2>/dev/null || true
          echo '=== RECENT WARNING EVENTS ==='
          kubectl -n "$namespace" get events --field-selector type=Warning --sort-by=.lastTimestamp 2>/dev/null | tail -n 80 || true
          echo '=== RECENT NORMAL EVENTS (LAST 40) ==='
          kubectl -n "$namespace" get events --field-selector type=Normal --sort-by=.lastTimestamp 2>/dev/null | tail -n 40 || true
          REMOTE

      - name: Reproduce failure without atomic cleanup and capture sanitized migrator output
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -i "$HOME/.ssh/id_ed25519" \
            "$HETZNER_USER@$HETZNER_HOST" \
            "sudo -n env KUBECONFIG=/etc/rancher/k3s/k3s.yaml bash -s" <<'REMOTE'
          set -Eeuo pipefail
          namespace=ocg-aachen-smoke
          release=aachen-smoke
          source_dir=/opt/zusammen-pilot/runtime-control/e2af505629252831197b149524b9126ecfb80343
          private_values=/opt/zusammen-pilot/private/aachen-private-values.yaml
          original="$source_dir/pilot/aachen/private-smoke-test.sh"
          diagnostic="$(mktemp /tmp/aachen-smoke-diagnostic.XXXXXX)"
          cleanup() {
            helm uninstall "$release" --namespace "$namespace" >/dev/null 2>&1 || true
            rm -f "$diagnostic"
          }
          trap cleanup EXIT INT TERM

          test -f "$original"
          test -f "$private_values"
          test "$(stat -c '%a' "$private_values")" = 600

          # Diagnostic-only copy: preserve every smoke gate but omit Helm --atomic
          # so failed pods survive long enough to inspect. The committed smoke
          # script itself is not modified by this workflow.
          sed '/^[[:space:]]*--atomic[[:space:]]*\\$/d' "$original" > "$diagnostic"
          chmod 700 "$diagnostic"

          set +e
          AACHEN_PRIVATE_VALUES_FILE="$private_values" AACHEN_TIMEOUT=3m bash "$diagnostic"
          smoke_rc=$?
          set -e

          echo "SMOKE_DIAGNOSTIC_RC=$smoke_rc"
          echo '=== FAILURE POD/JOB STATE ==='
          kubectl -n "$namespace" get pods,jobs -o wide 2>/dev/null || true
          echo '=== DBMIGRATOR LOG (SANITIZED) ==='
          kubectl -n "$namespace" logs job/dbmigrator-install -c dbmigrator --tail=160 2>&1 \
            | sed -E \
                -e 's#(postgres(ql)?://)[^[:space:]]+#\1[REDACTED_DB_URL]#g' \
                -e 's#([Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][=:])[[:graph:]]+#\1[REDACTED]#g' \
            || true
          echo '=== DB READY INIT LOG ==='
          kubectl -n "$namespace" logs job/dbmigrator-install -c check-db-ready --tail=80 2>&1 || true
          echo '=== CURRENT WARNING EVENTS ==='
          kubectl -n "$namespace" get events --field-selector type=Warning --sort-by=.lastTimestamp 2>/dev/null | tail -n 80 || true
          REMOTE
