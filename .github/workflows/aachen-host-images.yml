name: Aachen host image preparation

on:
  push:
    branches:
      - pilot-aachen-mvp
      - 'sync/ocg-upstream-*'
    paths:
      - .github/workflows/aachen-host-images.yml
      - .dockerignore
      - Cargo.*
      - docs/**
      - ocg-common/**
      - ocg-redirector/**
      - ocg-server/**
      - database/migrations/**
      - pilot/aachen/postgres-postgis/**
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: aachen-host-image-preparation
  cancel-in-progress: false

jobs:
  prepare-images:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      HETZNER_HOST: 178.104.6.218
      HETZNER_USER: deploy
    steps:
      - name: Wait for Aachen validation on this exact commit
        shell: bash
        run: |
          set -Eeuo pipefail
          deadline=$((SECONDS + 2100))
          while (( SECONDS < deadline )); do
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20")"
            validation="$(jq -c '[.workflow_runs[] | select(.name == "Aachen pilot validation")] | first // empty' <<<"$run_json")"
            if [[ -z "$validation" ]]; then
              echo 'Waiting for Aachen pilot validation run to appear...'
              sleep 15
              continue
            fi
            status="$(jq -r '.status' <<<"$validation")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$validation")"
            echo "Aachen validation status: $status ${conclusion:+($conclusion)}"
            if [[ "$status" == completed ]]; then
              [[ "$conclusion" == success ]] || { echo "Aachen validation did not succeed: $conclusion" >&2; exit 1; }
              exit 0
            fi
            sleep 20
          done
          echo 'Timed out waiting for Aachen pilot validation.' >&2
          exit 1

      - name: Prepare pinned SSH connection
        shell: bash
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$HETZNER_SSH_KEY" || { echo 'HETZNER_SSH_KEY secret is unavailable.' >&2; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          178.104.6.218 ssh-rsa 
          178.104.6.218 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBL5b78TTMb3CUYtD9jeG5HzGFdFF+EAYFpn+52F1dbJ/W1rSPyb7u1CD7e3arzj0RogUH8m7w+q0RlqE/231uKI=
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

      - name: Build and import exact-commit pilot images on host
        shell: bash
        run: |
          set -Eeuo pipefail
          host_log="$RUNNER_TEMP/aachen-host-images.log"
          evidence_file="$RUNNER_TEMP/aachen-image-evidence.env"
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -i "$HOME/.ssh/id_ed25519" \
            "$HETZNER_USER@$HETZNER_HOST" \
            "GITHUB_SHA='$GITHUB_SHA' bash -s" 2>&1 <<'REMOTE' | tee "$host_log"
          set -Eeuo pipefail
          test "$(uname -m)" = x86_64
          sudo -n true
          sudo -n k3s secrets-encrypt status | grep -q 'Encryption Status: Enabled'
          command -v git >/dev/null
          command -v docker >/dev/null
          command -v flock >/dev/null
          command -v k3s >/dev/null

          exec 9>/tmp/zusammen-pilot-aachen-images.lock
          flock -w 900 9 || {
            echo 'Timed out waiting for the exclusive Aachen image-build lock.' >&2
            exit 1
          }

          workdir="$(mktemp -d /tmp/aachen-images.XXXXXX)"
          cleanup() {
            rm -rf "$workdir"
          }
          trap cleanup EXIT

          git clone --quiet --no-checkout https://github.com/ungert359-max/zusammen-pilot-ocg.git "$workdir/repo"
          git -C "$workdir/repo" fetch --quiet --depth 1 origin "$GITHUB_SHA"
          git -C "$workdir/repo" checkout --quiet --detach "$GITHUB_SHA"
          test "$(git -C "$workdir/repo" rev-parse HEAD)" = "$GITHUB_SHA"

          cd "$workdir/repo"
          server_dockerfile="$workdir/ocg-server.Dockerfile"
          test "$(grep -Fxc 'RUN cargo build --locked --release' ocg-server/Dockerfile)" -eq 1
          sed \
            's|RUN cargo build --locked --release|RUN CARGO_BUILD_JOBS=1 CARGO_PROFILE_RELEASE_CODEGEN_UNITS=256 RUSTFLAGS="-C link-arg=-Wl,--no-keep-memory" cargo build --locked --release|' \
            ocg-server/Dockerfile > "$server_dockerfile"

          postgres_sha_image="zusammen-pilot-postgres:$GITHUB_SHA"
          migrator_sha_image="zusammen-pilot-dbmigrator:$GITHUB_SHA"
          server_sha_image="zusammen-pilot-server:$GITHUB_SHA"

          sudo -n docker build \
            -f pilot/aachen/postgres-postgis/Dockerfile \
            -t "$postgres_sha_image" \
            -t zusammen-pilot-postgres:local \
            .
          sudo -n docker build \
            -f database/migrations/Dockerfile \
            -t "$migrator_sha_image" \
            -t zusammen-pilot-dbmigrator:local \
            .
          sudo -n docker build \
            --build-arg "OCG_COMMIT_SHA=$GITHUB_SHA" \
            -f "$server_dockerfile" \
            -t "$server_sha_image" \
            -t zusammen-pilot-server:local \
            .

          sudo -n docker save -o "$workdir/postgres.tar" "$postgres_sha_image" zusammen-pilot-postgres:local
          sudo -n docker save -o "$workdir/dbmigrator.tar" "$migrator_sha_image" zusammen-pilot-dbmigrator:local
          sudo -n docker save -o "$workdir/server.tar" "$server_sha_image" zusammen-pilot-server:local
          sudo -n k3s ctr images import "$workdir/postgres.tar"
          sudo -n k3s ctr images import "$workdir/dbmigrator.tar"
          sudo -n k3s ctr images import "$workdir/server.tar"

          images_list="$(sudo -n k3s ctr images list)"

          image_digest() {
            local image_name="$1"
            local digest
            digest="$(awk -v name="$image_name" 'index($1, name) { print $3 }' <<<"$images_list" | sort -u)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "Expected exactly one digest for $image_name; observed '$digest'." >&2
              exit 1
            }
            printf '%s' "$digest"
          }

          postgres_digest="$(image_digest "$postgres_sha_image")"
          migrator_digest="$(image_digest "$migrator_sha_image")"
          server_digest="$(image_digest "$server_sha_image")"
          [[ "$(image_digest 'zusammen-pilot-postgres:local')" == "$postgres_digest" ]]
          [[ "$(image_digest 'zusammen-pilot-dbmigrator:local')" == "$migrator_digest" ]]
          [[ "$(image_digest 'zusammen-pilot-server:local')" == "$server_digest" ]]

          pin_imported_image() {
            local image_name="$1"
            local digest="$2"
            sudo -n k3s ctr images label "$image_name" \
              io.cri-containerd.pinned=pinned \
              io.cattle.k3s.pinned=pinned \
              >/dev/null
            if ! sudo -n k3s ctr images list | awk -v name="$image_name" -v digest="$digest" \
              '$1 == name && $3 == digest && index($0,"io.cri-containerd.pinned=pinned") { found=1 } END { exit !found }'; then
              echo "Imported image $image_name could not be pinned to $digest against k3s garbage collection." >&2
              exit 1
            fi
          }

          pin_imported_image "docker.io/library/$postgres_sha_image" "$postgres_digest"
          pin_imported_image "docker.io/library/$migrator_sha_image" "$migrator_digest"
          pin_imported_image "docker.io/library/$server_sha_image" "$server_digest"
          pin_imported_image 'docker.io/library/zusammen-pilot-postgres:local' "$postgres_digest"
          pin_imported_image 'docker.io/library/zusammen-pilot-dbmigrator:local' "$migrator_digest"
          pin_imported_image 'docker.io/library/zusammen-pilot-server:local' "$server_digest"

          printf 'PILOT_IMAGE_SHA=%s\n' "$GITHUB_SHA"
          printf 'POSTGRES_IMAGE_DIGEST=%s\n' "$postgres_digest"
          printf 'SERVER_IMAGE_DIGEST=%s\n' "$server_digest"
          printf 'MIGRATOR_IMAGE_DIGEST=%s\n' "$migrator_digest"
          echo "PASS: exact commit $GITHUB_SHA pilot images are imported into k3s."

          sudo -n docker image rm \
            "$postgres_sha_image" \
            "$migrator_sha_image" \
            "$server_sha_image" \
            zusammen-pilot-postgres:local \
            zusammen-pilot-dbmigrator:local \
            zusammen-pilot-server:local \
            >/dev/null 2>&1 || true
          REMOTE

          grep -E '^(PILOT_IMAGE_SHA|POSTGRES_IMAGE_DIGEST|SERVER_IMAGE_DIGEST|MIGRATOR_IMAGE_DIGEST)=' \
            "$host_log" > "$evidence_file"
          [[ "$(wc -l < "$evidence_file")" -eq 4 ]]
          python3 - "$evidence_file" "$GITHUB_SHA" <<'PY'
          import re
          import sys
          from pathlib import Path

          values = dict(
              line.split("=", 1)
              for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          )
          expected = {
              "PILOT_IMAGE_SHA",
              "POSTGRES_IMAGE_DIGEST",
              "SERVER_IMAGE_DIGEST",
              "MIGRATOR_IMAGE_DIGEST",
          }
          if set(values) != expected or values["PILOT_IMAGE_SHA"] != sys.argv[2]:
              raise SystemExit("exact-head image evidence is incomplete or mismatched")
          for key in expected - {"PILOT_IMAGE_SHA"}:
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", values[key]):
                  raise SystemExit(f"invalid digest in {key}")
          PY

      - name: Publish exact-head image digest evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aachen-image-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/aachen-image-evidence.env
          if-no-files-found: error
          retention-days: 7
