name: Aachen private runtime smoke

on:
  push:
    branches:
      - pilot-aachen-mvp
    paths:
      - .github/workflows/aachen-private-smoke.yml
      - pilot/aachen/private-smoke-test.sh
      - pilot/aachen/pin-runtime-images.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aachen-private-runtime-smoke
  cancel-in-progress: false

jobs:
  private-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HETZNER_HOST: 178.104.6.218
      HETZNER_USER: deploy
      # These exact pilot images were built and imported successfully on the
      # pilot host. Control-only pilot files may advance independently, but
      # the remote preflight below fails closed if any application/image input
      # changed since this commit.
      PILOT_IMAGE_SHA: c2db5863ffe27c987843b4e3b35edea38ef1751e
      PILOT_CONTROL_SHA: ${{ github.sha }}
      POSTGRES_IMAGE_DIGEST: sha256:8da9f9b4e84f360b75896c483b3c29aef30f80d0e5ca8fb3c8460b570cb964d8
      SERVER_IMAGE_DIGEST: sha256:91dd101373e4850c6dcdec0a490e4487bd4c97fd77cbf8118666b54f4dd9cfb0
      MIGRATOR_IMAGE_DIGEST: sha256:3b984728780d09bcc027275695a609034900c50da72697dbe6642105ced671a1
    steps:
      - name: Prepare pinned SSH connection
        shell: bash
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$HETZNER_SSH_KEY" || { echo 'HETZNER_SSH_KEY secret is unavailable.' >&2; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          178.104.6.218 ssh-rsa 
          178.104.6.218 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBL5b78TTMb3CUYtD9jeG5HzGFdFF+EAYFpn+52F1dbJ/W1rSPyb7u1CD7e3arzj0RogUH8m7w+q0RlqE/231uKI=
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

      - name: Generate server-private values and run exact-image smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -i "$HOME/.ssh/id_ed25519" \
            "$HETZNER_USER@$HETZNER_HOST" \
            "sudo -n env PILOT_IMAGE_SHA='$PILOT_IMAGE_SHA' PILOT_CONTROL_SHA='$PILOT_CONTROL_SHA' POSTGRES_IMAGE_DIGEST='$POSTGRES_IMAGE_DIGEST' SERVER_IMAGE_DIGEST='$SERVER_IMAGE_DIGEST' MIGRATOR_IMAGE_DIGEST='$MIGRATOR_IMAGE_DIGEST' KUBECONFIG=/etc/rancher/k3s/k3s.yaml bash -s" <<'REMOTE'
          set -Eeuo pipefail
          umask 077

          image_sha="${PILOT_IMAGE_SHA:?PILOT_IMAGE_SHA is required}"
          control_sha="${PILOT_CONTROL_SHA:?PILOT_CONTROL_SHA is required}"
          postgres_digest="${POSTGRES_IMAGE_DIGEST:?POSTGRES_IMAGE_DIGEST is required}"
          server_digest="${SERVER_IMAGE_DIGEST:?SERVER_IMAGE_DIGEST is required}"
          migrator_digest="${MIGRATOR_IMAGE_DIGEST:?MIGRATOR_IMAGE_DIGEST is required}"
          base_dir=/opt/zusammen-pilot
          source_dir="$base_dir/runtime-control/$control_sha"
          private_dir="$base_dir/private"
          private_values="$private_dir/aachen-private-values.yaml"

          command -v git >/dev/null
          command -v openssl >/dev/null
          command -v python3 >/dev/null
          command -v helm >/dev/null
          command -v kubectl >/dev/null
          command -v k3s >/dev/null
          command -v curl >/dev/null

          helm_version="$(helm version --short)"
          case "$helm_version" in
            v3.*) echo "HELM_RUNTIME=$helm_version" ;;
            *) echo "Aachen pilot requires the reviewed Helm 3 executable post-renderer path; found $helm_version" >&2; exit 1 ;;
          esac

          k3s secrets-encrypt status | grep -q 'Encryption Status: Enabled'

          if [[ ! -d "$source_dir/.git" ]]; then
            mkdir -p "$(dirname "$source_dir")"
            git clone --quiet --no-checkout https://github.com/ungert359-max/zusammen-pilot-ocg.git "$source_dir"
          fi
          git -C "$source_dir" fetch --quiet --depth 1 origin "$image_sha"
          git -C "$source_dir" fetch --quiet --depth 1 origin "$control_sha"
          git -C "$source_dir" checkout --quiet --detach "$control_sha"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$control_sha"

          # Reuse the already verified application images only while every change
          # since their build is confined to image-neutral CI or Aachen pilot
          # controls. The PostgreSQL image context remains a hard block, and any
          # path outside these two control scopes fails closed by default.
          unexpected_changes="$(
            git -C "$source_dir" diff --name-only "$image_sha" "$control_sha" -- | while IFS= read -r path; do
              case "$path" in
                .github/workflows/*) ;;
                pilot/aachen/postgres-postgis/*) printf '%s\n' "$path" ;;
                pilot/aachen/*) ;;
                *) printf '%s\n' "$path" ;;
              esac
            done
          )"
          if [[ -n "$unexpected_changes" ]]; then
            echo 'Application/image inputs changed since the imported image build; refusing to reuse stale images.' >&2
            printf '%s\n' "$unexpected_changes" >&2
            exit 1
          fi

          images_list="$(k3s ctr images list)"
          awk -v name='zusammen-pilot-postgres:local' -v digest="$postgres_digest" \
            'index($0,name) && index($0,digest) { found=1 } END { exit !found }' <<<"$images_list"
          awk -v name='zusammen-pilot-server:local' -v digest="$server_digest" \
            'index($0,name) && index($0,digest) { found=1 } END { exit !found }' <<<"$images_list"
          awk -v name='zusammen-pilot-dbmigrator:local' -v digest="$migrator_digest" \
            'index($0,name) && index($0,digest) { found=1 } END { exit !found }' <<<"$images_list"

          install -d -m 700 "$private_dir"
          if [[ ! -f "$private_values" ]]; then
            tmp_key="$(mktemp "$private_dir/.badge-key.XXXXXX")"
            private_der="$(mktemp "$private_dir/.badge-private.XXXXXX")"
            public_der="$(mktemp "$private_dir/.badge-public.XXXXXX")"
            cleanup_keys() {
              rm -f "$tmp_key" "$private_der" "$public_der"
            }
            trap cleanup_keys RETURN

            openssl genpkey -algorithm ED25519 -out "$tmp_key" >/dev/null 2>&1
            openssl pkey -in "$tmp_key" -outform DER -out "$private_der"
            openssl pkey -in "$tmp_key" -pubout -outform DER -out "$public_der"

            read -r jwk_x jwk_d < <(python3 - "$private_der" "$public_der" <<'PY'
          import base64
          import pathlib
          import sys

          private_der = pathlib.Path(sys.argv[1]).read_bytes()
          public_der = pathlib.Path(sys.argv[2]).read_bytes()
          private_prefix = bytes.fromhex('302e020100300506032b657004220420')
          public_prefix = bytes.fromhex('302a300506032b6570032100')
          if len(private_der) != len(private_prefix) + 32 or not private_der.startswith(private_prefix):
              raise SystemExit('unexpected Ed25519 PKCS#8 encoding')
          if len(public_der) != len(public_prefix) + 32 or not public_der.startswith(public_prefix):
              raise SystemExit('unexpected Ed25519 SubjectPublicKeyInfo encoding')
          seed = private_der[len(private_prefix):]
          public = public_der[len(public_prefix):]
          enc = lambda b: base64.urlsafe_b64encode(b).rstrip(b'=').decode('ascii')
          print(enc(public), enc(seed))
          PY
            )
            [[ -n "$jwk_x" && -n "$jwk_d" ]]
            db_password="$(openssl rand -hex 32)"

            cat > "$private_values" <<EOF
          db:
            password: "$db_password"
          postgresql:
            auth:
              password: "$db_password"
          email:
            # The inherited chart emits these fields unquoted. Quote tokens keep
            # them typed as strings without adding any real SMTP credential.
            fromAddress: '"noreply@aachen.invalid"'
            fromName: '"Aachen Pilot"'
            rcptsWhitelist: []
            smtp:
              host: '"localhost"'
              username: '""'
              password: '""'
          server:
            baseUrl: "http://127.0.0.1:9000"
            badges:
              signingKey:
                key_id: "aachen-pilot-v1"
                private_jwk:
                  kty: "OKP"
                  crv: "Ed25519"
                  x: "$jwk_x"
                  d: "$jwk_d"
          EOF
            chmod 600 "$private_values"
            cleanup_keys
            trap - RETURN
          fi

          # Preserve the existing database password and badge key, but refresh
          # this non-secret mail-disable block for private values files created
          # by earlier smoke runs. The update is atomic and emits no file data.
          python3 - "$private_values" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          mail_block = """email:
            # The inherited chart emits these fields unquoted. Quote tokens keep
            # them typed as strings without adding any real SMTP credential.
            fromAddress: '\"noreply@aachen.invalid\"'
            fromName: '\"Aachen Pilot\"'
            rcptsWhitelist: []
            smtp:
              host: '\"localhost\"'
              username: '\"\"'
              password: '\"\"'
          """.splitlines(keepends=True)

          def top_level_key(line):
              stripped = line.rstrip("\r\n")
              if not stripped or stripped[0].isspace():
                  return None
              match = re.fullmatch(r"([A-Za-z0-9_-]+):\s*(?:#.*)?", stripped)
              return match.group(1) if match else None

          email_starts = [i for i, line in enumerate(lines) if top_level_key(line) == "email"]
          if len(email_starts) > 1:
              raise SystemExit("private values contain multiple top-level email blocks")

          if email_starts:
              start = email_starts[0]
              end = next((i for i in range(start + 1, len(lines)) if top_level_key(lines[i])), len(lines))
              lines[start:end] = mail_block
          else:
              server_starts = [i for i, line in enumerate(lines) if top_level_key(line) == "server"]
              if len(server_starts) != 1:
                  raise SystemExit("private values must contain exactly one top-level server block")
              lines[server_starts[0]:server_starts[0]] = mail_block

          tmp = path.with_name(path.name + ".tmp")
          tmp.write_text("".join(lines), encoding="utf-8")
          tmp.chmod(0o600)
          tmp.replace(path)
          PY

          test "$(stat -c '%a' "$private_values")" = 600
          test "$(grep -c '^email:$' "$private_values")" = 1
          grep -Fq "fromAddress: '\"noreply@aachen.invalid\"'" "$private_values"
          grep -Fq "rcptsWhitelist: []" "$private_values"

          # This namespace/release is dedicated to this private smoke workflow.
          # Successful runs deliberately keep the known-good smoke release alive
          # for evidence; before the next serialized run, replace it with a fresh
          # install rather than exercising the still-unverified Helm upgrade path.
          if helm status aachen-smoke --namespace ocg-aachen-smoke >/dev/null 2>&1; then
            helm uninstall aachen-smoke --namespace ocg-aachen-smoke --wait --timeout 2m >/dev/null
          fi

          cd "$source_dir"
          AACHEN_PRIVATE_VALUES_FILE="$private_values" \
          AACHEN_TIMEOUT=12m \
          bash pilot/aachen/private-smoke-test.sh
          REMOTE
