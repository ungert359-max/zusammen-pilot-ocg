name: Aachen private runtime smoke

on:
  push:
    branches:
      - pilot-aachen-mvp
    paths:
      - .github/workflows/aachen-private-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HETZNER_HOST: 178.104.6.218
      HETZNER_USER: deploy
      # These exact application images were built and imported successfully on
      # the pilot host. Control-only pilot files may advance independently, but
      # the remote preflight below fails closed if any application/image input
      # changed since this commit.
      PILOT_IMAGE_SHA: 95ef22c66176ed52e966be6f2a71bac055d3274e
      PILOT_CONTROL_SHA: ${{ github.sha }}
      SERVER_IMAGE_DIGEST: sha256:8d8c96991d84b183acdce6240f995394c4fef45d27f4e8480bb5592b4cd7f586
      MIGRATOR_IMAGE_DIGEST: sha256:2fbb69770b4be04833a9c7c14b514eb80e3d22d41f4454139e148794fdef0062
    steps:
      - name: Prepare pinned SSH connection
        shell: bash
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$HETZNER_SSH_KEY" || { echo 'HETZNER_SSH_KEY secret is unavailable.' >&2; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          178.104.6.218 ssh-rsa 
          178.104.6.218 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBL5b78TTMb3CUYtD9jeG5HzGFdFF+EAYFpn+52F1dbJ/W1rSPyb7u1CD7e3arzj0RogUH8m7w+q0RlqE/231uKI=
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

      - name: Generate server-private values and run exact-image smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -i "$HOME/.ssh/id_ed25519" \
            "$HETZNER_USER@$HETZNER_HOST" \
            "sudo -n env PILOT_IMAGE_SHA='$PILOT_IMAGE_SHA' PILOT_CONTROL_SHA='$PILOT_CONTROL_SHA' SERVER_IMAGE_DIGEST='$SERVER_IMAGE_DIGEST' MIGRATOR_IMAGE_DIGEST='$MIGRATOR_IMAGE_DIGEST' KUBECONFIG=/etc/rancher/k3s/k3s.yaml bash -s" <<'REMOTE'
          set -Eeuo pipefail
          umask 077

          image_sha="${PILOT_IMAGE_SHA:?PILOT_IMAGE_SHA is required}"
          control_sha="${PILOT_CONTROL_SHA:?PILOT_CONTROL_SHA is required}"
          server_digest="${SERVER_IMAGE_DIGEST:?SERVER_IMAGE_DIGEST is required}"
          migrator_digest="${MIGRATOR_IMAGE_DIGEST:?MIGRATOR_IMAGE_DIGEST is required}"
          base_dir=/opt/zusammen-pilot
          source_dir="$base_dir/runtime-control/$control_sha"
          private_dir="$base_dir/private"
          private_values="$private_dir/aachen-private-values.yaml"

          command -v git >/dev/null
          command -v openssl >/dev/null
          command -v python3 >/dev/null
          command -v helm >/dev/null
          command -v kubectl >/dev/null
          command -v k3s >/dev/null
          command -v curl >/dev/null

          helm_version="$(helm version --short)"
          case "$helm_version" in
            v3.*) echo "HELM_RUNTIME=$helm_version" ;;
            *) echo "Aachen pilot requires the reviewed Helm 3 executable post-renderer path; found $helm_version" >&2; exit 1 ;;
          esac

          k3s secrets-encrypt status | grep -q 'Encryption Status: Enabled'

          if [[ ! -d "$source_dir/.git" ]]; then
            mkdir -p "$(dirname "$source_dir")"
            git clone --quiet --no-checkout https://github.com/ungert359-max/zusammen-pilot-ocg.git "$source_dir"
          fi
          git -C "$source_dir" fetch --quiet --depth 1 origin "$image_sha"
          git -C "$source_dir" fetch --quiet --depth 1 origin "$control_sha"
          git -C "$source_dir" checkout --quiet --detach "$control_sha"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$control_sha"

          # Reuse the already verified application images only while every change
          # since their build is confined to pilot control/validation files.
          unexpected_changes="$(
            git -C "$source_dir" diff --name-only "$image_sha" "$control_sha" -- | while IFS= read -r path; do
              case "$path" in
                .github/workflows/aachen-private-smoke.yml|\
                .github/workflows/aachen-remote-probe.yml|\
                .github/workflows/pilot-validate.yml|\
                pilot/aachen/private-smoke-test.sh|\
                pilot/aachen/pin-runtime-images.sh) ;;
                *) printf '%s\n' "$path" ;;
              esac
            done
          )"
          if [[ -n "$unexpected_changes" ]]; then
            echo 'Application/image inputs changed since the imported image build; refusing to reuse stale images.' >&2
            printf '%s\n' "$unexpected_changes" >&2
            exit 1
          fi

          images_list="$(k3s ctr images list)"
          awk -v name='zusammen-pilot-server:local' -v digest="$server_digest" \
            'index($0,name) && index($0,digest) { found=1 } END { exit !found }' <<<"$images_list"
          awk -v name='zusammen-pilot-dbmigrator:local' -v digest="$migrator_digest" \
            'index($0,name) && index($0,digest) { found=1 } END { exit !found }' <<<"$images_list"

          install -d -m 700 "$private_dir"
          if [[ ! -f "$private_values" ]]; then
            tmp_key="$(mktemp "$private_dir/.badge-key.XXXXXX")"
            private_der="$(mktemp "$private_dir/.badge-private.XXXXXX")"
            public_der="$(mktemp "$private_dir/.badge-public.XXXXXX")"
            cleanup_keys() {
              rm -f "$tmp_key" "$private_der" "$public_der"
            }
            trap cleanup_keys RETURN

            openssl genpkey -algorithm ED25519 -out "$tmp_key" >/dev/null 2>&1
            openssl pkey -in "$tmp_key" -outform DER -out "$private_der"
            openssl pkey -in "$tmp_key" -pubout -outform DER -out "$public_der"

            read -r jwk_x jwk_d < <(python3 - "$private_der" "$public_der" <<'PY'
          import base64
          import pathlib
          import sys

          private_der = pathlib.Path(sys.argv[1]).read_bytes()
          public_der = pathlib.Path(sys.argv[2]).read_bytes()
          private_prefix = bytes.fromhex('302e020100300506032b657004220420')
          public_prefix = bytes.fromhex('302a300506032b6570032100')
          if len(private_der) != len(private_prefix) + 32 or not private_der.startswith(private_prefix):
              raise SystemExit('unexpected Ed25519 PKCS#8 encoding')
          if len(public_der) != len(public_prefix) + 32 or not public_der.startswith(public_prefix):
              raise SystemExit('unexpected Ed25519 SubjectPublicKeyInfo encoding')
          seed = private_der[len(private_prefix):]
          public = public_der[len(public_prefix):]
          enc = lambda b: base64.urlsafe_b64encode(b).rstrip(b'=').decode('ascii')
          print(enc(public), enc(seed))
          PY
            )
            [[ -n "$jwk_x" && -n "$jwk_d" ]]
            db_password="$(openssl rand -hex 32)"

            cat > "$private_values" <<EOF
          db:
            password: "$db_password"
          postgresql:
            auth:
              password: "$db_password"
          email:
            rcptsWhitelist: []
          server:
            baseUrl: "http://127.0.0.1:9000"
            badges:
              signingKey:
                key_id: "aachen-pilot-v1"
                private_jwk:
                  kty: "OKP"
                  crv: "Ed25519"
                  x: "$jwk_x"
                  d: "$jwk_d"
          EOF
            chmod 600 "$private_values"
            cleanup_keys
            trap - RETURN
          fi

          test "$(stat -c '%a' "$private_values")" = 600
          cd "$source_dir"
          AACHEN_PRIVATE_VALUES_FILE="$private_values" \
          AACHEN_TIMEOUT=12m \
          bash pilot/aachen/private-smoke-test.sh
          REMOTE
