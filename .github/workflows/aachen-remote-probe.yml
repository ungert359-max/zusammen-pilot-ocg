name: Aachen remote host probe

on:
  push:
    branches:
      - pilot-aachen-mvp
    paths:
      - .github/workflows/aachen-remote-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare pinned SSH host key and deploy key
        shell: bash
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$HETZNER_SSH_KEY" || { echo 'HETZNER_SSH_KEY secret is unavailable.' >&2; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          178.104.6.218 ssh-rsa 
          178.104.6.218 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBL5b78TTMb3CUYtD9jeG5HzGFdFF+EAYFpn+52F1dbJ/W1rSPyb7u1CD7e3arzj0RogUH8m7w+q0RlqE/231uKI=
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

      - name: Read-only pilot host probe
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -i "$HOME/.ssh/id_ed25519" \
            deploy@178.104.6.218 \
            'set -eu
             K="sudo -n env KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl"
             echo "REMOTE_USER=$(id -un)"
             echo "REMOTE_HOST=$(hostname)"
             echo "REMOTE_ARCH=$(uname -m)"
             for c in git helm k3s docker kubectl python3; do
               if command -v "$c" >/dev/null 2>&1; then echo "TOOL_$c=present"; else echo "TOOL_$c=missing"; fi
             done
             if sudo -n true >/dev/null 2>&1; then
               echo "SUDO_NONINTERACTIVE=yes"
               sudo -n k3s secrets-encrypt status || true
               echo "SERVER_IMAGE_CHECK_BEGIN"
               sudo -n k3s ctr images list name==zusammen-pilot-server:local || true
               echo "SERVER_IMAGE_CHECK_END"
               echo "MIGRATOR_IMAGE_CHECK_BEGIN"
               sudo -n k3s ctr images list name==zusammen-pilot-dbmigrator:local || true
               echo "MIGRATOR_IMAGE_CHECK_END"
               echo "DEPENDENCY_IMAGE_DIGESTS_BEGIN"
               sudo -n k3s ctr images list | grep -E "artifacthub/postgres|bitnamilegacy/kubectl" || true
               echo "DEPENDENCY_IMAGE_DIGESTS_END"
               echo "RUNTIME_STATE_BEGIN"
               $K -n ocg-aachen-smoke get pods,svc,pvc -o wide 2>/dev/null || true
               $K -n ocg-aachen-smoke get events --sort-by=.lastTimestamp 2>/dev/null | tail -n 20 || true
               echo "RUNTIME_STATE_END"
               echo "SERVER_CONTAINER_EXIT_DIAGNOSTICS_BEGIN"
               for cid in $(sudo -n k3s crictl ps -a --name server -q 2>/dev/null | head -n 5 || true); do
                 sudo -n k3s crictl inspect "$cid" 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin).get('status',{}); print('SERVER_CONTAINER id=%s state=%s exit=%s reason=%s started=%s finished=%s' % (sys.argv[1], d.get('state',''), d.get('exitCode',''), d.get('reason',''), d.get('startedAt',''), d.get('finishedAt','')))" "$cid" || true
               done
               echo "SERVER_CONTAINER_EXIT_DIAGNOSTICS_END"
               echo "MIGRATION_DIAGNOSTICS_BEGIN"
               migrator_pod="$($K -n ocg-aachen-smoke get pods -l job-name=dbmigrator-install --sort-by=.metadata.creationTimestamp -o name 2>/dev/null | tail -n 1 || true)"
               if [ -n "$migrator_pod" ]; then
                 echo "MIGRATOR_POD=$migrator_pod"
                 $K -n ocg-aachen-smoke logs "$migrator_pod" -c check-db-ready --tail=80 2>&1 | sed -E "s/(password[=:][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig" || true
                 $K -n ocg-aachen-smoke logs "$migrator_pod" -c dbmigrator --tail=120 2>&1 | sed -E "s/(password[=:][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig" || true
               fi
               $K -n ocg-aachen-smoke describe job dbmigrator-install 2>/dev/null | tail -n 100 || true
               server_pod="$($K -n ocg-aachen-smoke get pods -l app.kubernetes.io/component=server --sort-by=.metadata.creationTimestamp -o name 2>/dev/null | tail -n 1 || true)"
               if [ -n "$server_pod" ]; then
                 $K -n ocg-aachen-smoke logs "$server_pod" -c check-dbmigrator-run --tail=80 2>&1 || true
               fi
               echo "MIGRATION_DIAGNOSTICS_END"
             else
               echo "SUDO_NONINTERACTIVE=no"
             fi'
