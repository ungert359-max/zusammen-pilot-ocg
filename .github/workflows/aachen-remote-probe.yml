name: Aachen remote host probe

on:
  push:
    branches:
      - pilot-aachen-mvp
    paths:
      - .github/workflows/aachen-remote-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare pinned SSH host key and deploy key
        shell: bash
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$HETZNER_SSH_KEY" || { echo 'HETZNER_SSH_KEY secret is unavailable.' >&2; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          178.104.6.218 ssh-rsa 
          178.104.6.218 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBL5b78TTMb3CUYtD9jeG5HzGFdFF+EAYFpn+52F1dbJ/W1rSPyb7u1CD7e3arzj0RogUH8m7w+q0RlqE/231uKI=
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

      - name: Read-only pilot host probe
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -i "$HOME/.ssh/id_ed25519" \
            deploy@178.104.6.218 \
            'set -eu
             echo "REMOTE_USER=$(id -un)"
             echo "REMOTE_HOST=$(hostname)"
             echo "REMOTE_ARCH=$(uname -m)"
             for c in git helm k3s docker kubectl; do
               if command -v "$c" >/dev/null 2>&1; then echo "TOOL_$c=present"; else echo "TOOL_$c=missing"; fi
             done
             if sudo -n true >/dev/null 2>&1; then
               echo "SUDO_NONINTERACTIVE=yes"
               sudo -n k3s secrets-encrypt status || true
               echo "SERVER_IMAGE_CHECK_BEGIN"
               sudo -n k3s ctr images list name==zusammen-pilot-server:local || true
               echo "SERVER_IMAGE_CHECK_END"
               echo "MIGRATOR_IMAGE_CHECK_BEGIN"
               sudo -n k3s ctr images list name==zusammen-pilot-dbmigrator:local || true
               echo "MIGRATOR_IMAGE_CHECK_END"
               echo "RUNTIME_STATE_BEGIN"
               sudo -n env KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl -n ocg-aachen-smoke get pods,svc,pvc -o wide 2>/dev/null || true
               sudo -n env KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl -n ocg-aachen-smoke get events --sort-by=.lastTimestamp 2>/dev/null | tail -n 20 || true
               echo "RUNTIME_STATE_END"
             else
               echo "SUDO_NONINTERACTIVE=no"
             fi'
