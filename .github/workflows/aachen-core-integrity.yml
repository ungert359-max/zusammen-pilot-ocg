name: Aachen upstream core integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  preserve-upstream-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch fork main reference
        shell: bash
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Validate guard script syntax
        shell: bash
        run: bash -n pilot/aachen/verify-upstream-core-untouched.sh

      - name: Reject local edits to upstream OCG core
        shell: bash
        run: |
          set -Eeuo pipefail
          base_ref=origin/main
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [[ "$branch" == sync/ocg-upstream-* ]]; then
            git fetch --no-tags \
              https://github.com/cncf/open-community-groups.git \
              main:refs/remotes/upstream/main
            base_ref=upstream/main
          fi
          bash pilot/aachen/verify-upstream-core-untouched.sh "$base_ref" HEAD
