name: Aachen private product E2E

on:
  push:
    branches:
      - pilot-aachen-mvp
      - 'sync/ocg-upstream-*'
    paths:
      - .github/workflows/aachen-private-product-e2e.yml
      - pilot/aachen/private-product-e2e-prepare.sh
      - pilot/aachen/private-product-e2e-run.sh
      - pilot/aachen/private-product-e2e-cluster-run.sh
      - pilot/aachen/private-product-e2e-sidecar-run.sh
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: aachen-private-runtime
  cancel-in-progress: false

jobs:
  product-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HETZNER_HOST: 178.104.6.218
      HETZNER_USER: deploy
      PILOT_CONTROL_SHA: ${{ github.sha }}
      AACHEN_E2E_NAMESPACE: ocg-aachen-e2e
      AACHEN_E2E_RELEASE: aachen-e2e

    steps:
      - name: Checkout exact control commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Publish exact-head Product E2E pending evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"description\":\"Exact-head private product E2E is running\",\"context\":\"aachen/product-e2e-evidence\"}" \
            >/dev/null

      - name: Wait for exact-head regression gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          wait_for_gate() {
            local workflow_id="$1"
            local label="$2"
            local response count status conclusion

            for _ in $(seq 1 720); do
              response="$(curl --fail --silent --show-error \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?event=push&head_sha=${GITHUB_SHA}&per_page=1")"

              read -r count status conclusion < <(
                python3 -c 'import json,sys; payload=json.load(sys.stdin); runs=payload.get("workflow_runs", []); print(0, "missing", "none") if not runs else print(1, runs[0].get("status", "unknown"), runs[0].get("conclusion") or "none")' <<<"$response"
              )

              if [[ "$count" == 1 && "$status" == completed ]]; then
                if [[ "$conclusion" == success ]]; then
                  echo "PASS: $label succeeded for exact HEAD $GITHUB_SHA."
                  return 0
                fi
                echo "FAIL: $label completed with conclusion '$conclusion' for exact HEAD $GITHUB_SHA." >&2
                return 1
              fi

              sleep 15
            done

            echo "FAIL: timed out waiting for $label on exact HEAD $GITHUB_SHA." >&2
            return 1
          }

          wait_for_gate 334455136 'Aachen upstream core integrity'
          wait_for_gate 333909374 'Aachen pilot validation'
          wait_for_gate 334185699 'Aachen host image preparation'

      - name: Load validated exact-head image evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/334185699/runs?event=push&head_sha=${GITHUB_SHA}&per_page=1")"
          host_run_id="$(python3 -c 'import json,sys; runs=json.load(sys.stdin).get("workflow_runs", []); print(runs[0]["id"] if len(runs) == 1 and runs[0].get("conclusion") == "success" else "")' <<<"$response")"
          [[ "$host_run_id" =~ ^[0-9]+$ ]] || {
            echo "Missing successful exact-head host image run for $GITHUB_SHA." >&2
            exit 1
          }

          evidence_dir="$RUNNER_TEMP/aachen-image-evidence"
          gh run download "$host_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "aachen-image-evidence-$GITHUB_SHA" \
            --dir "$evidence_dir"
          evidence_file="$evidence_dir/aachen-image-evidence.env"

          python3 - "$evidence_file" "$GITHUB_SHA" "$GITHUB_ENV" <<'PY'
          import re
          import sys
          from pathlib import Path

          evidence_file = Path(sys.argv[1])
          expected_sha = sys.argv[2]
          github_env = Path(sys.argv[3])
          values = dict(
              line.split("=", 1)
              for line in evidence_file.read_text(encoding="utf-8").splitlines()
          )
          expected = {
              "PILOT_IMAGE_SHA",
              "POSTGRES_IMAGE_DIGEST",
              "SERVER_IMAGE_DIGEST",
              "MIGRATOR_IMAGE_DIGEST",
          }
          if set(values) != expected or values["PILOT_IMAGE_SHA"] != expected_sha:
              raise SystemExit("exact-head image evidence is incomplete or mismatched")
          for key in expected - {"PILOT_IMAGE_SHA"}:
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", values[key]):
                  raise SystemExit(f"invalid digest in {key}")
          with github_env.open("a", encoding="utf-8") as target:
              for key in sorted(expected):
                  target.write(f"{key}={values[key]}\n")
          PY

      - name: Prepare pinned SSH connection
        shell: bash
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$HETZNER_SSH_KEY" || { echo 'HETZNER_SSH_KEY secret is unavailable.' >&2; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          178.104.6.218 ssh-rsa 
          178.104.6.218 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBL5b78TTMb3CUYtD9jeG5HzGFdFF+EAYFpn+52F1dbJ/W1rSPyb7u1CD7e3arzj0RogUH8m7w+q0RlqE/231uKI=
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

      - name: Prepare isolated synthetic runtime on the private host
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -i "$HOME/.ssh/id_ed25519" \
            "$HETZNER_USER@$HETZNER_HOST" \
            "sudo -n env PILOT_IMAGE_SHA='$PILOT_IMAGE_SHA' PILOT_CONTROL_SHA='$PILOT_CONTROL_SHA' POSTGRES_IMAGE_DIGEST='$POSTGRES_IMAGE_DIGEST' SERVER_IMAGE_DIGEST='$SERVER_IMAGE_DIGEST' MIGRATOR_IMAGE_DIGEST='$MIGRATOR_IMAGE_DIGEST' AACHEN_E2E_NAMESPACE='$AACHEN_E2E_NAMESPACE' AACHEN_E2E_RELEASE='$AACHEN_E2E_RELEASE' KUBECONFIG=/etc/rancher/k3s/k3s.yaml bash -s" <<'REMOTE'
          set -Eeuo pipefail
          umask 077

          image_sha="${PILOT_IMAGE_SHA:?PILOT_IMAGE_SHA is required}"
          control_sha="${PILOT_CONTROL_SHA:?PILOT_CONTROL_SHA is required}"
          postgres_digest="${POSTGRES_IMAGE_DIGEST:?POSTGRES_IMAGE_DIGEST is required}"
          server_digest="${SERVER_IMAGE_DIGEST:?SERVER_IMAGE_DIGEST is required}"
          migrator_digest="${MIGRATOR_IMAGE_DIGEST:?MIGRATOR_IMAGE_DIGEST is required}"
          namespace="${AACHEN_E2E_NAMESPACE:?AACHEN_E2E_NAMESPACE is required}"
          release="${AACHEN_E2E_RELEASE:?AACHEN_E2E_RELEASE is required}"
          base_dir=/opt/zusammen-pilot
          source_dir="$base_dir/runtime-control/$control_sha"
          private_values="$base_dir/private/aachen-private-values.yaml"

          command -v git >/dev/null
          command -v k3s >/dev/null
          command -v kubectl >/dev/null
          k3s secrets-encrypt status | grep -q 'Encryption Status: Enabled'

          if [[ ! -d "$source_dir/.git" ]]; then
            mkdir -p "$(dirname "$source_dir")"
            git clone --quiet --no-checkout https://github.com/ungert359-max/zusammen-pilot-ocg.git "$source_dir"
          fi
          git -C "$source_dir" fetch --quiet --depth 1 origin "$image_sha"
          git -C "$source_dir" fetch --quiet --depth 1 origin "$control_sha"
          git -C "$source_dir" checkout --quiet --detach "$control_sha"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$control_sha"

          unexpected_changes="$(
            git -C "$source_dir" diff --name-only "$image_sha" "$control_sha" -- | while IFS= read -r path; do
              case "$path" in
                .github/workflows/*) ;;
                pilot/aachen/postgres-postgis/*) printf '%s\n' "$path" ;;
                pilot/aachen/*) ;;
                *) printf '%s\n' "$path" ;;
              esac
            done
          )"
          if [[ -n "$unexpected_changes" ]]; then
            echo 'Application/image inputs changed since the imported image build; refusing private product E2E on stale images.' >&2
            printf '%s\n' "$unexpected_changes" >&2
            exit 1
          fi

          images_list="$(k3s ctr images list)"
          require_pinned_image_digest() {
            local label="$1"
            local name="$2"
            local digest="$3"
            if ! awk -v name="$name" -v digest="$digest" \
              'index($0,name) && index($0,digest) && index($0,"io.cri-containerd.pinned=pinned") { found=1 } END { exit !found }' <<<"$images_list"; then
              echo "FAIL: $label image is not pinned to the exact imported digest $digest." >&2
              awk -v name="$name" 'index($0,name) { print "OBSERVED_IMAGE: " $0 }' <<<"$images_list" >&2
              exit 1
            fi
            echo "PASS: $label image is pinned to exact imported digest $digest."
          }
          require_pinned_image_digest postgres 'docker.io/library/zusammen-pilot-postgres:local' "$postgres_digest"
          require_pinned_image_digest server 'docker.io/library/zusammen-pilot-server:local' "$server_digest"
          require_pinned_image_digest migrator 'docker.io/library/zusammen-pilot-dbmigrator:local' "$migrator_digest"

          test -f "$private_values"
          case "$(stat -c '%a' "$private_values")" in
            400|600) ;;
            *) echo 'Private values permissions must be 400 or 600.' >&2; exit 1 ;;
          esac

          cd "$source_dir"
          AACHEN_PRIVATE_VALUES_FILE="$private_values" \
          AACHEN_E2E_NAMESPACE="$namespace" \
          AACHEN_E2E_RELEASE="$release" \
          AACHEN_E2E_TIMEOUT=12m \
          bash pilot/aachen/private-product-e2e-prepare.sh prepare
          REMOTE

      - name: Run unchanged upstream product suite inside private cluster
        shell: bash
        run: |
          set -Eeuo pipefail
          raw_log="$RUNNER_TEMP/aachen-product-e2e.raw.log"
          diagnostics_log="$RUNNER_TEMP/aachen-product-e2e-diagnostics.log"
          rm -f "$raw_log" "$diagnostics_log"

          set +e
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -i "$HOME/.ssh/id_ed25519" \
            "$HETZNER_USER@$HETZNER_HOST" \
            "sudo -n env PILOT_CONTROL_SHA='$PILOT_CONTROL_SHA' AACHEN_E2E_NAMESPACE='$AACHEN_E2E_NAMESPACE' AACHEN_E2E_RELEASE='$AACHEN_E2E_RELEASE' KUBECONFIG=/etc/rancher/k3s/k3s.yaml bash -s" 2>&1 <<'REMOTE' | tee "$raw_log"
          set -Eeuo pipefail
          source_dir="/opt/zusammen-pilot/runtime-control/${PILOT_CONTROL_SHA:?PILOT_CONTROL_SHA is required}"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$PILOT_CONTROL_SHA"
          test -f "$source_dir/pilot/aachen/private-product-e2e-cluster-run.sh"
          cd "$source_dir"
          AACHEN_E2E_NAMESPACE="${AACHEN_E2E_NAMESPACE:?AACHEN_E2E_NAMESPACE is required}" \
          AACHEN_E2E_RELEASE="${AACHEN_E2E_RELEASE:?AACHEN_E2E_RELEASE is required}" \
          AACHEN_E2E_RUN_FULL_SUITE=true \
          bash pilot/aachen/private-product-e2e-cluster-run.sh
          REMOTE
          ssh_status=${PIPESTATUS[0]}
          set -e

          if [[ "$ssh_status" -ne 0 ]]; then
            python3 - "$raw_log" "$diagnostics_log" <<'PY'
          import re
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          lines = source.read_text(encoding="utf-8", errors="replace").splitlines()[-350:]
          sensitive_line = re.compile(r"(?i)(authorization|private[ _-]?key|password|secret|bearer[ :]|ssh-rsa|ecdsa-sha2)")
          email = re.compile(r"[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}", re.IGNORECASE)
          long_token = re.compile(r"(?<![A-Za-z0-9])[A-Za-z0-9_+/=-]{48,}(?![A-Za-z0-9])")

          sanitized = []
          for line in lines:
              if sensitive_line.search(line):
                  sanitized.append("[redacted sensitive-looking diagnostic line]")
                  continue
              line = email.sub("<redacted-email>", line)
              line = long_token.sub("<redacted-long-token>", line)
              sanitized.append(line)

          target.write_text("\n".join(sanitized) + "\n", encoding="utf-8")
          PY
            rm -f "$raw_log"
            exit "$ssh_status"
          fi

          rm -f "$raw_log"

      - name: Collect sanitized PostgreSQL failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          diagnostics_log="$RUNNER_TEMP/aachen-product-e2e-diagnostics.log"
          touch "$diagnostics_log"

          if [[ ! -f "$HOME/.ssh/id_ed25519" || ! -f "$HOME/.ssh/known_hosts" ]]; then
            echo 'PostgreSQL diagnostics unavailable: SSH material was not prepared.' >> "$diagnostics_log"
            exit 0
          fi

          set +e
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 \
            -i "$HOME/.ssh/id_ed25519" \
            "$HETZNER_USER@$HETZNER_HOST" \
            "sudo -n env AACHEN_E2E_NAMESPACE='$AACHEN_E2E_NAMESPACE' KUBECONFIG=/etc/rancher/k3s/k3s.yaml bash -s" 2>&1 <<'REMOTE' >> "$diagnostics_log"
          set -Eeuo pipefail
          namespace="${AACHEN_E2E_NAMESPACE:?AACHEN_E2E_NAMESPACE is required}"
          command -v kubectl >/dev/null
          command -v python3 >/dev/null

          sanitize() {
            python3 -c '
          import re
          import sys

          sensitive_line = re.compile(r"(?i)(authorization|private[ _-]?key|password|secret|bearer[ :]|ssh-rsa|ecdsa-sha2)")
          email = re.compile(r"[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}", re.IGNORECASE)
          long_token = re.compile(r"(?<![A-Za-z0-9])[A-Za-z0-9_+/=-]{48,}(?![A-Za-z0-9])")

          for raw_line in sys.stdin:
              line = raw_line.rstrip("\n")
              if sensitive_line.search(line):
                  print("[redacted sensitive-looking PostgreSQL diagnostic line]")
                  continue
              line = email.sub("<redacted-email>", line)
              line = long_token.sub("<redacted-long-token>", line)
              print(line)
          '
          }

          postgres_pod="$(
            kubectl -n "$namespace" get pods -o json |
              python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)
          matches = []
          for item in data.get("items", []):
              images = [container.get("image", "") for container in item.get("spec", {}).get("containers", [])]
              if "zusammen-pilot-postgres:local" in images:
                  name = item.get("metadata", {}).get("name", "")
                  if name:
                      matches.append(name)

          if len(matches) != 1:
              raise SystemExit(f"expected exactly one isolated PostgreSQL pod, found {len(matches)}")
          print(matches[0])
          '
          )"

          echo '--- sanitized private PostgreSQL pod state (diagnostic only) ---'
          kubectl -n "$namespace" get pod "$postgres_pod" -o json |
            python3 -c '
          import json
          import sys

          pod = json.load(sys.stdin)
          statuses = pod.get("status", {}).get("containerStatuses", [])
          status = statuses[0] if statuses else {}
          state = status.get("state", {})
          last_state = status.get("lastState", {})
          ready = status.get("ready")
          restart_count = status.get("restartCount", 0)
          print("pod={}".format(pod.get("metadata", {}).get("name", "")))
          print("phase={}".format(pod.get("status", {}).get("phase", "")))
          print(f"ready={ready}")
          print(f"restartCount={restart_count}")
          for label, value in (("state", state), ("lastState", last_state)):
              for kind in ("waiting", "terminated"):
                  detail = value.get(kind)
                  if not detail:
                      continue
                  safe = {key: detail.get(key) for key in ("reason", "exitCode", "startedAt", "finishedAt") if key in detail}
                  print(f"{label}.{kind}={safe}")
          '

          echo '--- sanitized private PostgreSQL current log tail ---'
          kubectl -n "$namespace" logs "$postgres_pod" --tail=200 --timestamps=true 2>&1 | sanitize || true

          restart_count="$(kubectl -n "$namespace" get pod "$postgres_pod" -o jsonpath='{.status.containerStatuses[0].restartCount}')"
          if [[ "$restart_count" =~ ^[0-9]+$ ]] && (( restart_count > 0 )); then
            echo '--- sanitized private PostgreSQL previous-container log tail ---'
            kubectl -n "$namespace" logs "$postgres_pod" --previous --tail=120 --timestamps=true 2>&1 | sanitize || true
          fi

          echo '--- sanitized private PostgreSQL pod events ---'
          kubectl -n "$namespace" get events \
            --field-selector "involvedObject.name=$postgres_pod" \
            --sort-by=.lastTimestamp \
            -o 'custom-columns=TYPE:.type,REASON:.reason,COUNT:.count,MESSAGE:.message' \
            --no-headers 2>&1 | tail -n 60 | sanitize || true
          echo '--- end sanitized private PostgreSQL diagnostics ---'
          REMOTE
          diagnostic_status=$?
          set -e

          if [[ "$diagnostic_status" -ne 0 ]]; then
            echo 'PostgreSQL diagnostics collection failed without changing the original E2E result.' >> "$diagnostics_log"
          fi
          exit 0
      - name: Upload sanitized product E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aachen-product-e2e-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/aachen-product-e2e-diagnostics.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Remove dedicated synthetic E2E namespace
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -f "$HOME/.ssh/id_ed25519" || ! -f "$HOME/.ssh/known_hosts" ]]; then
            echo 'SSH material was not prepared; no remote E2E namespace could have been created.'
            exit 0
          fi

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 \
            -i "$HOME/.ssh/id_ed25519" \
            "$HETZNER_USER@$HETZNER_HOST" \
            "sudo -n env PILOT_CONTROL_SHA='$PILOT_CONTROL_SHA' AACHEN_E2E_NAMESPACE='$AACHEN_E2E_NAMESPACE' AACHEN_E2E_RELEASE='$AACHEN_E2E_RELEASE' KUBECONFIG=/etc/rancher/k3s/k3s.yaml bash -s" <<'REMOTE'
          set -Eeuo pipefail
          source_dir="/opt/zusammen-pilot/runtime-control/${PILOT_CONTROL_SHA:?PILOT_CONTROL_SHA is required}"
          test -f "$source_dir/pilot/aachen/private-product-e2e-prepare.sh"
          cd "$source_dir"
          AACHEN_E2E_NAMESPACE="${AACHEN_E2E_NAMESPACE:?AACHEN_E2E_NAMESPACE is required}" \
          AACHEN_E2E_RELEASE="${AACHEN_E2E_RELEASE:?AACHEN_E2E_RELEASE is required}" \
          bash pilot/aachen/private-product-e2e-prepare.sh cleanup
          REMOTE

      - name: Publish exact-head Product E2E success evidence
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"description\":\"Exact-head private product E2E passed\",\"context\":\"aachen/product-e2e-evidence\"}" \
            >/dev/null

      - name: Publish exact-head Product E2E failure evidence
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"description\":\"Exact-head private product E2E failed\",\"context\":\"aachen/product-e2e-evidence\"}" \
            >/dev/null
