# Non-sensitive Helm overrides for the Aachen MVP.
# Connection details and credentials are supplied only at deploy time.
# The first private smoke test uses images built and imported on the pilot host.

imageTag: local
pullPolicy: IfNotPresent

images:
  provider: db

meetings:
  zoom:
    enabled: false

# Deliberate pilot lockout: preserve the complete upstream ticketing/payment/refund
# implementation, but do not activate paid ticketing in the initial Aachen pilot.
# Changing this to true requires separate explicit approval and the dedicated
# payment/ticketing validation gate documented in DEPLOYMENT-GATES.md.
payments:
  enabled: false

dbmigrator:
  job:
    image:
      repository: zusammen-pilot-dbmigrator

redirector:
  enabled: false

server:
  ingress:
    enabled: false
  service:
    type: ClusterIP
  login:
    email: true
    github: false
    linuxfoundation: false
  deploy:
    image:
      repository: zusammen-pilot-server
    replicaCount: 1

postgresql:
  enabled: true
  # Keep the inherited chart's reviewed database image reference as a render-time
  # sentinel only. The Aachen post-renderer replaces it with the locally built,
  # registry-closed PostgreSQL 17 + PostGIS image before anything reaches k3s.
  # The actual runtime base digest is pinned in postgres-postgis/Dockerfile.
  image:
    digest: sha256:411febeab51f103cd36aa8655bebb3c4035974e0d6f6929a56fe863ad8c581b6
    pullPolicy: Never
  # Keep the dependency database identity identical to OCG's db.* contract.
  auth:
    username: ocg
    database: ocg
    enablePostgresUser: false
  # The Docker Official PostgreSQL image uses PGDATA below the mounted parent.
  # Mounting the parent lets the non-root postgres user create/own PGDATA while
  # Kubernetes fsGroup grants access to the persistent volume root.
  postgresqlDataDir: /var/lib/postgresql/data
  primary:
    persistence:
      mountPath: /var/lib/postgresql
    podSecurityContext:
      enabled: true
      fsGroup: 999
      fsGroupChangePolicy: OnRootMismatch
    containerSecurityContext:
      enabled: true
      runAsUser: 999
      runAsGroup: 999
      runAsNonRoot: true
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    extraEnvVars:
      - name: POSTGRES_DB
        value: ocg
