# Non-sensitive Helm overrides for the Aachen MVP.
# Connection details and credentials are supplied only at deploy time.
# The first private smoke test uses the images built and imported on the pilot host.

imageTag: local
pullPolicy: IfNotPresent

images:
  provider: db

meetings:
  zoom:
    enabled: false

payments:
  enabled: false

dbmigrator:
  job:
    image:
      repository: zusammen-pilot-dbmigrator

redirector:
  enabled: false

server:
  ingress:
    enabled: false
  service:
    type: ClusterIP
  login:
    email: true
    github: false
    linuxfoundation: false
  deploy:
    image:
      repository: zusammen-pilot-server
    replicaCount: 1

postgresql:
  enabled: true
