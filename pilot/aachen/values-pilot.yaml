# Non-sensitive Helm overrides for the Aachen MVP.
# Connection details and credentials are supplied only at deploy time.
# The first private smoke test uses images built and imported on the pilot host.

imageTag: local
pullPolicy: IfNotPresent

images:
  provider: db

meetings:
  zoom:
    enabled: false

payments:
  enabled: false

dbmigrator:
  job:
    image:
      repository: zusammen-pilot-dbmigrator

redirector:
  enabled: false

server:
  ingress:
    enabled: false
  service:
    type: ClusterIP
  login:
    email: true
    github: false
    linuxfoundation: false
  deploy:
    image:
      repository: zusammen-pilot-server
    replicaCount: 1

postgresql:
  enabled: true
  # Keep the exact reviewed upstream database base recorded here. The Aachen
  # post-renderer maps this rendered reference to the locally built
  # zusammen-pilot-postgres:local image, whose Dockerfile inherits this digest
  # and adds only the PostGIS package required by the unchanged OCG migration.
  image:
    digest: sha256:411febeab51f103cd36aa8655bebb3c4035974e0d6f6929a56fe863ad8c581b6
    pullPolicy: Never
